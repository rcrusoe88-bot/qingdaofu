name: Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qingdaofu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned test runner
        shell: powershell
        run: Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test actual cleanup engine
        shell: powershell
        run: ./qdf-tests/Run-Tests.ps1
      - name: Test Go backends
        shell: pwsh
        run: |
          go test -mod=readonly ./gui ./cmd/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly ./gui ./cmd/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test frontend lifecycle
        run: node --test qdf-tests/frontend.test.cjs
      - name: Install matching Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify actual portable package
        shell: powershell
        run: ./scripts/build-portable.ps1 -SkipTests
