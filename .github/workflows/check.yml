name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting without rewriting sources
        shell: pwsh
        run: |
          $files = Get-ChildItem cmd,gui -Recurse -Filter *.go | Select-Object -ExpandProperty FullName
          $unformatted = & gofmt -l $files
          if ($LASTEXITCODE -ne 0 -or $unformatted) { throw "Unformatted Go files: $unformatted" }
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem app,lib,bin,scripts,packaging,qdf-tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $errors | Write-Output; $failed = $true }
          }
          if ($failed) { exit 1 }
