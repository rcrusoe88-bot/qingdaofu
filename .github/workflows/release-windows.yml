name: Build QingDaoFu Portable
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test backends and frontend
        shell: pwsh
        run: |
          go test -mod=readonly ./gui ./cmd/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test qdf-tests/frontend.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and verify portable package
        shell: powershell
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: QingDaoFu-Portable
          path: |
            release/**/qingdaofu-*-x64.zip
            release/**/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: QingDaoFu-Portable
          path: portable
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            portable/**/*.zip
            portable/**/SHA256SUMS.txt
          body_path: RELEASE.md
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          generate_release_notes: false
