name: Build QingDaoFu Portable
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck -Confirm:$false
          }
          Import-Module Pester -RequiredVersion 3.4.0 -ErrorAction Stop
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test backends and frontend
        shell: pwsh
        run: |
          go test -mod=readonly ./gui ./cmd/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test qdf-tests/frontend.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and verify portable package
        shell: powershell
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: QingDaoFu-Portable
          path: |
            release/**/qingdaofu-*-x64.zip
            release/**/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: QingDaoFu-Portable
          path: portable
      # RELEASE.md keeps every version. Publishing the whole file made each
      # release repeat all older sections, so cut out this tag's section.
      - name: Extract this tag's section from RELEASE.md
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          tag = os.environ['GITHUB_REF'].split('/')[-1]
          version = tag[1:] if tag.startswith('v') else tag
          with open('RELEASE.md', encoding='utf-8') as fh:
              text = fh.read()
          start = re.search(r'^## v' + re.escape(version) + r'(?=\s|$).*$', text, re.M)
          if not start:
              print(f'RELEASE.md has no section for {tag}', file=sys.stderr)
              sys.exit(1)
          rest = text[start.end():]
          nxt = re.search(r'^## v', rest, re.M)
          section = text[start.start():start.end() + (nxt.start() if nxt else len(rest))]
          with open('release-notes.md', 'w', encoding='utf-8') as fh:
              fh.write(section.rstrip() + '\n')
          print(f'Extracted {len(section)} chars for {tag}')
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            portable/**/*.zip
            portable/**/SHA256SUMS.txt
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          generate_release_notes: false
