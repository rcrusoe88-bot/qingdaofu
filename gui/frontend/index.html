<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清道夫</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-tab="clean">
<div id="app">

    <header class="tabbar">
        <div class="brand">
            <img class="brand-mark" src="brand.svg" alt="" aria-hidden="true">
            <span class="brand-words">
                <span class="brand-name" data-i18n="appTitle">清道夫</span>
                <span class="brand-sub">QINGDAO FU</span>
            </span>
        </div>
        <nav class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="clean"   data-i18n="tabClean">清理</button>
            <button class="tab" role="tab" data-tab="analyze" data-i18n="tabAnalyze">分析</button>
            <button class="tab" role="tab" data-tab="history" data-i18n="tabHistory">记录</button>
            <button class="tab" role="tab" data-tab="status"  data-i18n="tabStatus">状态</button>
        </nav>
        <div class="tabbar-end">
            <div class="win-controls">
                <button class="win-btn" data-action="win-min" title="最小化" aria-label="最小化">&#x2013;</button>
                <button class="win-btn" data-action="win-max" title="最大化" aria-label="最大化">&#x25A1;</button>
                <button class="win-btn close" data-action="win-close" title="关闭" aria-label="关闭">&#x00D7;</button>
            </div>
        </div>
    </header>

    <main id="main">
        <section class="tabpane" data-pane="clean">
            <div class="pane-scroll" id="cleanScroll"></div>
            <footer class="pane-footer" id="cleanFooter"></footer>
        </section>

        <section class="tabpane hidden" data-pane="analyze">
            <div class="pane-scroll" id="analyzeScroll"></div>
            <footer class="pane-footer" id="analyzeFooter"></footer>
        </section>

        <section class="tabpane hidden" data-pane="history">
            <div class="pane-scroll" id="historyScroll"></div>
            <footer class="pane-footer" id="historyFooter"></footer>
        </section>

        <section class="tabpane hidden" data-pane="status">
            <div class="pane-scroll" id="statusScroll"></div>
            <footer class="pane-footer" id="statusFooter"></footer>
        </section>
    </main>

    <div id="ctxMenu" class="ctx hidden"></div>

    <div id="errorBanner" class="hidden">
        <span class="err-mark" aria-hidden="true">!</span>
        <span id="errorMessage"></span>
        <button class="btn small ghost" id="errorDismiss" data-i18n="closeButton">关闭</button>
    </div>

</div>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
