<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    清道夫品牌图标 — 几何构造（圆 + 圆角方），不用生图。
    构形：圆角方代表容器/磁盘，右下圆形缺口代表被释放的空间，
          左上奶油点保持构图平衡，也像"已清点的一个条目"。
    配色与 gui/frontend/app.css 的令牌逐字一致：
      海沫绿 #E2E7BF 底 · 粉红 #F2B9B2 主体 · 粉白 #FBF2E3 缺口与点
    纯扁平、无渐变、无阴影、无描边——因为它是界面的一部分，
    不是一张插画，任何立体效果都会和周围的扁平卡片打架。
  -->
  <rect x="112" y="112" width="288" height="288" rx="64" fill="#F2B9B2"/>
  <circle cx="352" cy="352" r="72" fill="#FBF2E3"/>
  <circle cx="192" cy="192" r="26" fill="#FBF2E3"/>
</svg>
